<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark background -->
  <rect width="32" height="32" rx="8" fill="#020408"/>

  <!-- Outer ring -->
  <circle cx="16" cy="16" r="11" stroke="#00E5FF" stroke-width="1.5" opacity="0.9"/>

  <!-- Middle ring -->
  <circle cx="16" cy="16" r="7" stroke="#00E5FF" stroke-width="1" opacity="0.55"/>

  <!-- Inner dot -->
  <circle cx="16" cy="16" r="2.5" fill="#00E5FF" opacity="0.95"/>

  <!-- Cross hairs -->
  <line x1="16" y1="3" x2="16" y2="8"  stroke="#00E5FF" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <line x1="16" y1="24" x2="16" y2="29" stroke="#00E5FF" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <line x1="3"  y1="16" x2="8"  y2="16" stroke="#00E5FF" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <line x1="24" y1="16" x2="29" y2="16" stroke="#00E5FF" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

  <!-- Glow center -->
  <circle cx="16" cy="16" r="3.5" fill="#00E5FF" opacity="0.15"/>
</svg>
